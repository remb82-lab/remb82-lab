<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101923">
  <meta name="color-scheme" content="light dark">
  <title>Контур — Telegram Mini App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="miniapp.css">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body class="telegram-miniapp">
  <header>
    <b>КОНТУР <small>ПОТОЛКИ</small></b>
    <span id="connection"></span>
  </header>
  <main>
    <aside>
      <div id="tg-user" class="tg-user" hidden></div>
      <h2>Объекты</h2>
      <button id="new">+ Новый объект</button>
      <div id="projects"></div>
      <hr>
      <button id="backup" class="secondary">Скачать резервную копию</button>
      <label class="file">Восстановить из JSON<input type="file" id="restore" accept="application/json"></label>
      <p class="hint">Расчёты хранятся на устройстве. Для переноса используйте резервную копию.</p>
    </aside>
    <article>
      <div class="title">
        <div><small>TELEGRAM MINI APP · ЗАМЕРЩИК</small><h1>Замер и расчёт</h1></div>
        <span id="saved"></span>
      </div>
      <div id="editor"></div>
      <section>
        <h2>Документы</h2>
        <div class="actions">
          <button data-doc="client">Смета клиенту</button>
          <button data-doc="mount" class="secondary">Монтажный лист</button>
          <button data-doc="buy" class="secondary">Закупка</button>
        </div>
        <p class="hint">Документ открывается для печати или сохранения PDF.</p>
      </section>
    </article>
  </main>
  <script src="telegram-miniapp.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
